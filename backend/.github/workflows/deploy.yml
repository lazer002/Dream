name: Backend CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  APP_DIR: /home/ubuntu/projects/UrbanZoro
  PM2_APP_NAME: ecommerce-api

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to EC2
    needs: ci
    runs-on: ubuntu-latest
    # Only this job may ask AWS for a deploy token (not the CI job that runs npm ci).
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActionsUrbanZoroDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy through AWS Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Preparing deployment"
          echo "======================================"

          PARAMETERS=$(jq -n \
            --rawfile script .github/scripts/deploy-ec2.sh \
            '{commands: [$script]}')

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions deployment ${GITHUB_SHA}" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          echo "======================================"
          echo "Waiting for deployment"
          echo "======================================"

          for i in {1..60}; do

            STATUS=$(aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text)

            echo "Deployment status: ${STATUS}"

            case "${STATUS}" in

              Success)
                echo "======================================"
                echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
                echo "======================================"

                echo "EC2 output:"

                aws ssm get-command-invocation \
                  --region "${AWS_REGION}" \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                  --query "StandardOutputContent" \
                  --output text

                echo "======================================"
                echo "DEPLOYMENT COMPLETE"
                echo "======================================"

                exit 0
                ;;

              Failed|Cancelled|TimedOut)
                echo "======================================"
                echo "DEPLOYMENT FAILED"
                echo "======================================"

                echo "SSM output:"

                aws ssm get-command-invocation \
                  --region "${AWS_REGION}" \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                  --output json

                exit 1
                ;;

            esac

            sleep 5

          done

          echo "======================================"
          echo "DEPLOYMENT TIMEOUT"
          echo "======================================"

          exit 1